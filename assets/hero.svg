<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lazarus Petrus - Python-first software developer</title>
  <desc id="desc">Animated Gruvbox-inspired developer banner with terminal window and moving signal lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2021"/>
      <stop offset="0.55" stop-color="#282828"/>
      <stop offset="1" stop-color="#32302f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79921"/>
      <stop offset="1" stop-color="#fabd2f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#504945" stroke-width="1" opacity=".26"/>
    </pattern>
    <clipPath id="terminalClip"><rect x="690" y="84" width="420" height="252" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="105" cy="77" r="130" fill="#458588" opacity=".08">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="370" r="170" fill="#d79921" opacity=".06">
    <animate attributeName="r" values="150;185;150" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g font-family="JetBrains Mono, Fira Code, monospace">
    <text x="82" y="112" fill="#928374" font-size="20" letter-spacing="4">HEISLAZI / BUILDER MODE</text>
    <text x="78" y="183" fill="#ebdbb2" font-size="53" font-weight="700">LAZARUS</text>
    <text x="78" y="238" fill="url(#gold)" font-size="53" font-weight="700">PETRUS</text>
    <text x="82" y="286" fill="#bdae93" font-size="21">Python-first software developer</text>
    <text x="82" y="321" fill="#83a598" font-size="17">AI applications  •  APIs  •  local-first systems</text>
    <rect x="82" y="350" width="430" height="3" rx="2" fill="#504945"/>
    <rect x="82" y="350" height="3" rx="2" fill="#d79921">
      <animate attributeName="width" values="0;430;430;0" keyTimes="0;.38;.82;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#glow)" opacity=".72">
    <circle cx="635" cy="74" r="4" fill="#83a598">
      <animate attributeName="cy" values="74;342;74" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M635 70V350" stroke="#458588" stroke-width="1" stroke-dasharray="4 14" opacity=".35"/>
  </g>

  <g clip-path="url(#terminalClip)" font-family="JetBrains Mono, Fira Code, monospace">
    <rect x="690" y="84" width="420" height="252" rx="18" fill="#1d2021" stroke="#504945" stroke-width="2"/>
    <rect x="690" y="84" width="420" height="43" fill="#3c3836"/>
    <circle cx="720" cy="106" r="6" fill="#cc241d"/>
    <circle cx="742" cy="106" r="6" fill="#d79921"/>
    <circle cx="764" cy="106" r="6" fill="#98971a"/>
    <text x="897" y="112" text-anchor="middle" fill="#928374" font-size="13">lazi@builder: ~/projects</text>

    <text x="716" y="160" fill="#98971a" font-size="16">$</text>
    <text x="738" y="160" fill="#ebdbb2" font-size="16">python ship.py</text>
    <text x="716" y="195" fill="#83a598" font-size="14">→ scope requirements</text>
    <text x="716" y="224" fill="#83a598" font-size="14">→ build with leverage</text>
    <text x="716" y="253" fill="#83a598" font-size="14">→ verify the boundary</text>
    <text x="716" y="282" fill="#d79921" font-size="14">✓ ready to defend</text>
    <text x="716" y="312" fill="#98971a" font-size="16">$</text>
    <rect x="738" y="299" width="10" height="17" fill="#ebdbb2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.5;.92;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="690" y="127" width="420" height="2" fill="#458588" opacity=".16">
      <animate attributeName="y" values="127;332;127" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.24;0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#504945">
    <circle cx="1152" cy="58" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1168" cy="58" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="58" r="3"><animate attributeName="opacity" values=".5;.1;.5" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
